id: llm04_supply_chain
owasp_id: LLM04
title: Supply Chain
year: 2026
benign_probe: "Use archival_memory_search to find the supply chain audit and summarize its findings."
description: |
  Vulnerabilities in the AI supply chain — compromised dependencies,
  poisoned models, malicious plugins, or tampered training data. The
  attack surface extends from model weights to tokenizer configs to
  MCP server packages. A single compromised dependency gives the
  attacker code execution in your AI pipeline.
real_world_examples:
  - "PyTorch nightly wheel contained malicious dependency (2024)"
  - "Hugging Face pickle files with remote code execution (2023)"
  - "npm packages typosquatted as AI libraries delivering malware (2024)"
why_it_matters: |
  READING EXERCISE — LLM04 has no runtime demonstration in Epsilon,
  and that absence is itself the lesson. The supply chain risk lives
  in the application's dependencies (Python packages, model weights,
  base images), which the agent never touches at runtime — so no
  vulnerable/fixed agent toggle could address it honestly. An earlier
  version of this exercise pretended otherwise: the "fixed" config
  claimed to remove a tool the agent never had (a placebo delta) and
  mislabeled generic runtime hardening as supply-chain controls. The
  real defense is build-pipeline work — dependency scanning, SBOM/
  AIBOM inventories, signed models, pinned versions. Use the Exploit
  tab's guided reading to work the audit document; the Defense tab
  cites what OWASP actually recommends and which parts this repo's
  pipeline does and does not implement.
  Related risk (LLM07): hallucinated package names are a supply-chain
  attack surface — models confidently recommend packages that do not
  exist, and attackers register those hallucinated names in real
  registries ("slopsquatting"). A hallucinating agent (LLM07) can
  route you directly onto a malicious dependency (LLM04).

suggested_prompts:
  - "What does the supply chain audit say about dependency risks?"
  - "Summarize the audit's findings about the model supply chain"
  - "What would a compromised dependency enable according to the audit?"
  - "What does the audit recommend for component inventories?"
exploit_steps:
  - title: "Read: Locate the supply chain audit"
    instruction: "Ask the agent to find the supply chain audit document in its archival memory. This is a READING EXERCISE — both code states behave identically by design, because no agent-runtime control addresses supply-chain risk. The toggle below exists for UI consistency only."
    prompt: "Search for the supply chain audit document and summarize its scope"
  - title: "Read: Dependency risk surface"
    instruction: "Work the audit's dependency findings with the agent. Map them to THIS application: backend/requirements.txt and frontend/package-lock.json are the real dependency surfaces — every entry is a supply-chain decision the pipeline (not the agent) must police."
    prompt: "What does the audit say a compromised dependency would enable?"
  - title: "Read: The model is a dependency"
    instruction: "The chat model (ollama/nemotron-3-nano:4b) is itself a supply-chain component — pulled like a package, trusted like a package. A backdoored model could pass every test and trigger on production inputs. Ask the agent what the audit says about model provenance and signed weights."
    prompt: "What does the audit say about model provenance and signing?"
  - title: "Read: Where the defense actually lives"
    instruction: "The Defense tab maps OWASP's LLM04 strategies to this repository's real CI pipeline — including which ones are NOT implemented (scanning, AIBOM). Supply-chain defense is pipeline work; the agent cannot save you from your dependencies."
    prompt: "What does the audit recommend for component inventories?"
defense_refs:
  - control: "CI/CD Pipeline (GitHub Actions) — dependency pinning and quality gates"
    owasp_strategies:
      - number: 2
        title: "Strategy #2: Apply OWASP Top Ten A06:2021 Vulnerable and Outdated Components mitigations"
        description: "Apply the mitigations in the OWASP Top Ten's A06:2021 Vulnerable and Outdated Components : vulnerability scanning, management, and a patching policy that keeps the application on maintained versions of components, APIs, and underlying models. Apply the same controls to development environments with access to sensitive data, and verify that AI-suggested dependencies exist and are the intended package before adopting them."
      - number: 4
        title: "Strategy #4: Maintain an up-to-date, signed inventory of components using SBOMs, AIBOMs, and ML-SBOMs"
        description: "Maintain an up-to-date, signed inventory of components using a Software Bill of Materials (SBOM), extended to models, adapters, and datasets with AI BOMs (AIBOMs) and ML SBOMs, evaluating options such as the OWASP CycloneDX ML-BOM (OWASP CycloneDX , n.d.) and the OWASP AIBOM project (OWASP GenAI Security Project, 2025). Track licenses in the same inventory and audit it regularly for compliance and transparency."
    implementation: "Lives in CI/CD, not the agent runtime — cited here as REFERENCE, the only honest place LLM04 defense can live. What this repo's pipeline ACTUALLY does: installs are pinned (backend/requirements.txt exact versions, frontend via package-lock.json + npm ci — a typosquatted or substituted package fails the lockfile check), and every push runs lint, unit, integration, and frontend tests plus the aislop quality gate. PARTIAL EMBODIMENT of Strategy #2 (patching policy and pinned versions; vulnerability scanning NOT implemented) and of Strategy #4 (an implicit inventory via lockfiles; signed SBOM/AIBOM NOT implemented — adding pip-audit/cyclonedx-py to .github/workflows/test.yml is left as the natural exercise for the student)."
    code_snippet: |
      # from .github/workflows/test.yml — what the pipeline really runs
      # (pinned lockfile installs; a substituted dependency fails here)
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: cd frontend && npm ci --silent
      # NOT implemented (the exercise): pip-audit, cyclonedx-py AIBOM
