# LLM06: Unbounded Consumption — Vulnerable Configuration
# No token budget, no rate limits, no loop detection, no circuit breaker.
# An attacker can exhaust resources with long prompts, tool loops, or
# adversarial inputs that maximize token generation.

system_prompt: >
  You are a helpful assistant. You have access to file_read,
  archival_memory_search, and archival_memory_insert tools. There are no
  limits on what you can do.

tools:
  - file_read
  - archival_memory_search
  - archival_memory_insert

# No policy — allow all tool calls with no rate limits
policy: {}

canary: false
content_validation: false

# v0.16.35: reasoning watchdog ON — kills degenerate reasoning
# generations (token-collapse) mid-stream; the step completes with
# what streamed. An AVAILABILITY bound, not a security control (see
# LLM06) — it changes nothing about what the model reads or answers.
reasoning_watchdog: true
#
# LLM06 note: the watchdog bounds generation DEGENERACY (availability,
# both states, infrastructure) — the consumption bounds this exercise
# contrasts (rate caps, token budgets) are the fixed-state additions;
# a student comparing states sees caps+budget appear in fixed, the
# watchdog in both.
documents:
  - knowledge_base.txt
