name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Release-repo CI: the cheap push tier only (lint, unit,
  # integration, frontend). The aislop gate and the live-model
  # dispatch tiers (chips, e2e) live in the dev repo — the release
  # repo's CI validates the repo, not the app's runtime model
  # behavior.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: cd backend && pytest tests/unit/ -v

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: epsilon
          POSTGRES_PASSWORD: epsilon
          POSTGRES_DB: epsilon
        ports:
          # EXPLICIT host:container mapping. Bare "- 5432" publishes to
          # a RANDOM host port — localhost:5432 then refuses. This job
          # ran vacuously for weeks, so the bug was invisible until real
          # tests landed (2026-08-30).
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: cd backend && pytest tests/integration/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://epsilon:epsilon@localhost:5432/epsilon
          REDIS_URL: redis://localhost:6379/0

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --silent
      - run: cd frontend && npm test
